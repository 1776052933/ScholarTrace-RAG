services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholartrace}
      MYSQL_USER: ${MYSQL_USER:-scholartrace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  milvus_etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    networks:
      default:
        aliases:
          - milvus-etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  milvus_minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio_data:/minio_data
    networks:
      default:
        aliases:
          - milvus-minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
  milvus:
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus_etcd:
        condition: service_healthy
      milvus_minio:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-scholartrace}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scholartrace}?charset=utf8mb4
      AUTO_PAPER_DATA_ROOT: /app/data/m2
      RAG_VECTOR_BACKEND: milvus
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-paper_chunks_m3}
      MILVUS_URI: http://milvus:19530
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-dense}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_PDF_PARSER_BACKEND: ${RAG_PDF_PARSER_BACKEND:-pymupdf}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      SEARCH_GRAPH_MAX_SECONDS: ${SEARCH_GRAPH_MAX_SECONDS:-300}
      RAG_EVIDENCE_MAX_EXPANSIONS: ${RAG_EVIDENCE_MAX_EXPANSIONS:-1}
      CHAT_HISTORY_MAX_TURNS: ${CHAT_HISTORY_MAX_TURNS:-6}
      CHAT_HISTORY_MAX_CHARS: ${CHAT_HISTORY_MAX_CHARS:-6000}
      CHAT_PROMPT_MAX_CHARS: ${CHAT_PROMPT_MAX_CHARS:-24000}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-2048}
      CHAT_LEASE_SECONDS: ${CHAT_LEASE_SECONDS:-900}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./data/m2:/app/data/m2
    ports:
      - "127.0.0.1:${SCHOLARTRACE_API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      start_period: 60s
      timeout: 8s
      retries: 5
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 1"]
  mcp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      SCHOLARTRACE_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${SCHOLARTRACE_MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.mcp.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-scholartrace}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scholartrace}?charset=utf8mb4
      AUTO_PAPER_DATA_ROOT: /app/data/m2
      CELERY_BROKER_URL: redis://redis:6379/0
      RAG_VECTOR_BACKEND: milvus
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-paper_chunks_m3}
      MILVUS_URI: http://milvus:19530
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-dense}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_PDF_PARSER_BACKEND: ${RAG_PDF_PARSER_BACKEND:-pymupdf}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      - ./data/m2:/app/data/m2
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-scholartrace}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scholartrace}?charset=utf8mb4
      AUTO_PAPER_DATA_ROOT: /app/data/m2
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.tasks:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/scholartrace-celerybeat"]
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      AUTO_PAPER_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${SCHOLARTRACE_UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      start_period: 60s
      timeout: 8s
      retries: 5
    command: ["python", "-m", "streamlit", "run", "Auto_Paper_UI/ui_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
volumes:
  mysql_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  redis_data:
