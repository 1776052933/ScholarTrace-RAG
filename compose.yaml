services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholartrace}
      MYSQL_USER: ${MYSQL_USER:-scholartrace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-scholartrace}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scholartrace}?charset=utf8mb4
      AUTO_PAPER_DATA_ROOT: /app/data/m2
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./data/m2:/app/data/m2
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 1"]
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      AUTO_PAPER_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    command: ["python", "-m", "streamlit", "run", "Auto_Paper_UI/ui_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
volumes:
  mysql_data:
