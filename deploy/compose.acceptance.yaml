# Optional isolated acceptance overlay. Never inherit ambient search credentials.
# Use with: docker compose -f compose.yaml -f deploy/compose.acceptance.yaml ...
services:
  api:
    environment:
      SERPAPI_API_KEY: ""
      OPENALEX_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
  worker:
    environment:
      SERPAPI_API_KEY: ""
      OPENALEX_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
